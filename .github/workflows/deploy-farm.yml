# Deploys the Keyframe editing farm (worker/modal_app.py) to Modal whenever the
# pipeline or the farm changes. Needs two repository secrets, from Modal ->
# Settings -> API tokens: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
name: Deploy editing farm

on:
  push:
    branches: [main, claude/nice-ride-dasb06]
    paths:
      - "keyframe_hdr/**"
      - "worker/**"
      - "scripts/setup_worker.sh"
      - ".github/workflows/deploy-farm.yml"
  workflow_dispatch:

concurrency:
  group: deploy-farm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check the Modal token is set
        id: token
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::notice::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository secrets to deploy the editing farm."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          pip install -q "modal>=1.6,<1.7"
          modal deploy worker/modal_app.py
      - name: Start address (paste into Photo edits -> Settings)
        if: steps.token.outputs.ok == 'true'
        run: |
          python - <<'PY'
          import modal
          url = modal.Function.from_name("keyframe-editing-farm", "start").get_web_url()
          print(url)
          print(f"::notice title=Editing farm start address::{url}")
          PY

<title>__KF_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one delivery per property - a quiet header with the download, then the
   photographs edge to edge in a 3:2 grid. Same tokens as Keyframe Studio. */
:root {
  --bg: #f2f3f5; --surface: #ffffff; --ink: #15171c; --muted: #646b78; --line: #e0e3e8;
  --brass: #9a6b30; --brass-ink: #ffffff; --brass-soft: #f4ebdf; --day: #c98a1c; --dusk: #6b55c9;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --surface: #191c22; --ink: #eceef2; --muted: #9aa1ad; --line: #2b3038;
  --brass: #d3a463; --brass-ink: #1a1408; --brass-soft: #2d261c; --day: #e6ab47; --dusk: #a593f0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191c22; --ink: #eceef2; --muted: #9aa1ad; --line: #2b3038;
  --brass: #d3a463; --brass-ink: #1a1408; --brass-soft: #2d261c; --day: #e6ab47; --dusk: #a593f0; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
header { display: flex; flex-wrap: wrap; gap: 18px 32px; align-items: flex-end; justify-content: space-between;
  padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4.2vw, 46px); line-height: 1.1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 13.5px; align-items: center; }
.meta .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.get { display: grid; gap: 6px; justify-items: end; }
.primary { background: var(--brass); color: var(--brass-ink); border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; font-size: 15px; }
.primary:disabled { opacity: .6; cursor: default; }
.get small { color: var(--muted); font-size: 12.5px; }
@media (max-width: 640px) { .get { justify-items: start; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.grid button { padding: 0; border: 0; background: var(--surface); border-radius: 4px; overflow: hidden; aspect-ratio: 3 / 2; max-width: 100%; position: relative; }
.grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
.grid button:hover img { transform: scale(1.02); }
@media (prefers-reduced-motion: reduce) { .grid img { transition: none; } }
.grid .n { position: absolute; left: 8px; bottom: 6px; font-family: var(--mono); font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.pending { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
.lightbox { position: fixed; inset: 0; background: rgba(8,9,12,.92); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; z-index: 20; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.lbbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #e9ebef; }
.lbbar b { font-family: var(--mono); font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; }
.lbnav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid #3a3f48; background: #1c1f25; color: #e9ebef; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn.main { background: #d3a463; color: #1a1408; border-color: #d3a463; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; font-size: 13.5px; z-index: 30; max-width: calc(100% - 32px); }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Keyframe Media · Final images</p>
      <h1 id="title">Preparing delivery</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="get">
      <button class="primary" id="zipBtn" disabled>Download all</button>
      <small id="zipNote">Full-resolution JPEGs in one folder (.zip)</small>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="pending" id="pending">The images for this property are still being uploaded. This page fills in when they are ready.</div>
  <footer id="foot">Full-resolution JPEG, sRGB, up to 10 MB each. Edited by Keyframe Media.</footer>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="lbbar"><b id="lbName"></b><button class="btn" id="lbClose">Close</button></div>
  <img id="lbImg" alt="">
  <div class="lbnav"><button class="btn" id="lbPrev">Previous</button><button class="btn main" id="lbSave">Download this image</button><button class="btn" id="lbNext">Next</button></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const DATA = /*__KF_DATA__*/null;
  const $ = (id) => document.getElementById(id);
  const blob = (id) => "/_blob/" + id;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safe = (s) => String(s || "Keyframe").replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 100);
  let downloads = null;
  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4000); }

  if (!DATA || !DATA.images || !DATA.images.length) return;
  const ims = DATA.images;
  const day = DATA.style === "day";
  const sky = { original: "Original sky", clouds: day ? "Sky: blue with clouds" : "Sky: dusk clouds", clear: day ? "Sky: clear blue" : "Sky: clear dusk" }[DATA.sky] || "";
  const total = ims.reduce((a, b) => a + (b.bytes || 0), 0);
  $("title").textContent = DATA.property || "Delivery";
  $("pending").hidden = true;
  $("meta").innerHTML = '<span><i class="dot" style="background:var(' + (day ? "--day" : "--dusk") + ')"></i>' + (day ? "Daytime" : "Twilight" + (DATA.look === "purple" ? ", purple dusk" : "")) + "</span>"
    + (sky ? "<span>" + esc(sky) + "</span>" : "")
    + '<span class="num">' + ims.length + " images</span>"
    + '<span class="num">' + (total / 1e9).toFixed(2) + " GB</span>"
    + (DATA.finished ? "<span>Edited " + esc(new Date(DATA.finished).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })) + "</span>" : "");
  $("grid").innerHTML = ims.map((im, i) => '<button data-i="' + i + '" aria-label="View ' + esc(im.file) + '"><img loading="lazy" src="' + blob(im.thumb) + '" alt=""><span class="n">' + String(im.n).padStart(2, "0") + "</span></button>").join("");
  $("zipBtn").textContent = "Download all " + ims.length + " images";

  // lightbox
  let cur = 0;
  function show() { const im = ims[cur]; $("lbImg").src = blob(im.thumb); $("lbName").textContent = im.file + "  ·  " + (cur + 1) + " / " + ims.length + "  ·  " + (im.bytes / 1e6).toFixed(1) + " MB"; }
  $("grid").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; cur = +b.dataset.i; show(); $("lightbox").hidden = false; $("lbClose").focus(); });
  $("lbClose").onclick = () => { $("lightbox").hidden = true; $("lbImg").src = ""; };
  $("lbPrev").onclick = () => { cur = (cur - 1 + ims.length) % ims.length; show(); };
  $("lbNext").onclick = () => { cur = (cur + 1) % ims.length; show(); };
  document.addEventListener("keydown", (e) => { if ($("lightbox").hidden) return;
    if (e.key === "Escape") $("lbClose").click(); if (e.key === "ArrowLeft") $("lbPrev").click(); if (e.key === "ArrowRight") $("lbNext").click(); });
  $("lbSave").onclick = async () => {
    if (!downloads) { toast("Downloads aren't available in this view."); return; }
    try { const r = await fetch(blob(ims[cur].full)); await downloads.save({ filename: ims[cur].file, data: await r.blob() }); }
    catch (err) { if (!(err && err.code === "declined")) toast("Download failed. Try again."); }
  };

  // download all as one folder
  $("zipBtn").onclick = async () => {
    if (!downloads) { toast("Downloads aren't available in this view."); return; }
    if (typeof JSZip === "undefined") { toast("The zip tool didn't load. Reload the page and try again."); return; }
    const btn = $("zipBtn"); btn.disabled = true;
    const folder = safe(DATA.property);
    const zip = new JSZip(); const dir = zip.folder(folder);
    try {
      for (let i = 0; i < ims.length; i++) {
        btn.textContent = "Collecting " + (i + 1) + " of " + ims.length;
        const r = await fetch(blob(ims[i].full)); if (!r.ok) throw new Error("fetch " + r.status);
        dir.file(ims[i].file, await r.blob(), { binary: true });
      }
      btn.textContent = "Packing…";
      const z = await zip.generateAsync({ type: "blob", compression: "STORE", streamFiles: true });
      const res = await downloads.save({ filename: folder + ".zip", data: z });
      if (res && res.status === "saved") toast("Saved " + folder + ".zip");
    } catch (err) {
      const c = err && err.code;
      toast(c === "declined" ? "Download cancelled" : c === "too_large" ? "Too large for this device. Download images one at a time." : "Download failed. Try again.");
    } finally { btn.disabled = false; btn.textContent = "Download all " + ims.length + " images"; }
  };
  claude.use("downloads").then((d) => { downloads = d; $("zipBtn").disabled = !d; if (!d) $("zipNote").textContent = "Open this page in claude.ai to download."; }).catch(() => {});
})();
</script>
